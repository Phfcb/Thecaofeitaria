<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self';">
    <title>Painel de Pedidos | Thecãofeitaria</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="js/config.js" defer></script>
    <script src="js/admin.js" defer></script>
</head>
<body>
    <header class="admin-header">
        <div class="container header-inner">
            <div class="brand">
                <img src="images/logo.jpeg" alt="Thecãofeitaria">
                <div>
                    <h1>Painel de Pedidos</h1>
                    <span>Thecãofeitaria</span>
                </div>
            </div>
            <div class="header-actions">
                <button type="button" id="btn-open-password" class="btn btn-outline btn-sm" hidden>Alterar senha</button>
                <button type="button" id="btn-logout" class="btn btn-outline btn-sm" hidden>Sair</button>
            </div>
        </div>
    </header>

    <main class="container main-content">
        <section id="login-view" class="card login-card">
            <h2>Entrar</h2>
            <p class="muted">Use seu e-mail e senha para gerenciar as encomendas.</p>

            <form id="login-form" class="stack">
                <div class="field">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" autocomplete="current-password" required>
                </div>
                <p id="login-erro" class="error-msg" role="alert" hidden></p>
                <button type="submit" id="btn-login" class="btn btn-primary btn-block">Entrar</button>
            </form>
        </section>

        <section id="password-view" class="card login-card" hidden>
            <h2>Alterar senha</h2>
            <p class="muted">Escolha uma nova senha com pelo menos 6 caracteres.</p>

            <form id="password-form" class="stack">
                <div class="field">
                    <label for="new-password">Nova senha</label>
                    <input type="password" id="new-password" minlength="6" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirmar nova senha</label>
                    <input type="password" id="confirm-password" minlength="6" autocomplete="new-password" required>
                </div>
                <p id="password-msg" class="error-msg" role="alert" hidden></p>
                <div class="row-actions">
                    <button type="submit" id="btn-save-password" class="btn btn-primary">Salvar senha</button>
                    <button type="button" id="btn-cancel-password" class="btn btn-outline">Voltar</button>
                </div>
            </form>
        </section>

        <section id="orders-view" hidden>
            <div class="toolbar">
                <div class="tabs" role="tablist">
                    <button type="button" class="tab active" data-filter="ativos">Ativos</button>
                    <button type="button" class="tab" data-filter="entregues">Entregues</button>
                    <button type="button" class="tab" data-filter="todos">Todos</button>
                </div>
                <div class="search-row">
                    <input type="search" id="search-input" placeholder="Buscar por nome do cliente ou código (TCF-...)">
                    <button type="button" id="btn-refresh" class="btn btn-outline btn-sm">Atualizar</button>
                </div>
            </div>

            <p id="orders-status" class="muted status-msg" hidden></p>
            <div id="orders-list" class="orders-grid"></div>
        </section>
    </main>
</body>
</html>
